version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 adopted via alias migration: `typescript` is aliased to the
      # @typescript/typescript6 compat shim for typescript-eslint, with the real
      # 7.x compiler under `typescript-native`. Dependabot's npm alias-spec
      # handling is known-flaky upstream, so both alias lines are bumped by
      # hand rather than left to Dependabot.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript-native"
      # Pin @types/node to Node 24 LTS typings until we upgrade Node.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # nodemailer is pinned in both dependencies and overrides (next-auth's
      # optional peer range still trails behind; confirmed still ^7.0.7 || ^8.0.5
      # as of nodemailer 10.x), so npm requires both entries to move in
      # lockstep. Dependabot only bumps one side and its own dry-run install
      # fails with EOVERRIDE. Bump by hand instead.
      # Tracking: https://github.com/WheelieLabs/familychart/issues/3
      - dependency-name: "nodemailer"
    groups:
      # Group minor and patch updates together to reduce PR noise
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"