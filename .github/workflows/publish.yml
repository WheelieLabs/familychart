name: Build and publish container

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Cache npm store
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Third-party notices drift check
        run: |
          node scripts/generate-third-party-notices.mjs
          git diff --exit-code -- THIRD-PARTY-NOTICES.md

  build-amd64:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Image registry (lowercase for GHCR)
        id: image
        run: echo "reg=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push amd64
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.reg }}:build-${{ github.sha }}-amd64
          platforms: linux/amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

  build-arm64:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Image registry (lowercase for GHCR)
        id: image
        run: echo "reg=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.reg }}:build-${{ github.sha }}-arm64
          platforms: linux/arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  merge:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Image tags (semver from Git tag; latest on stable only)
        id: tags
        run: |
          reg="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "tags<<TAGS_EOF"
            echo "${reg}:${GITHUB_SHA}"
            echo "${reg}:${GITHUB_REF_NAME}"
            if [[ "$GITHUB_REF_NAME" != *-* ]]; then
              echo "${reg}:latest"
            fi
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifest
        run: |
          reg="ghcr.io/${GITHUB_REPOSITORY,,}"
          amd64="${reg}:build-${GITHUB_SHA}-amd64"
          arm64="${reg}:build-${GITHUB_SHA}-arm64"
          args=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && args+=("-t" "$tag")
          done <<< "${{ steps.tags.outputs.tags }}"
          docker buildx imagetools create "${args[@]}" "$amd64" "$arm64"
